[project]
name = "sun_graph"
version = "1.0.0"
description = "Sunlight graphs, a world map of solar time vs clock time, and an Earth-Moon-Sun animation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Miguel Campilho" }]
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
graph = ["geopy", "timezonefinder", "tzdata"]
map = ["scipy", "cartopy", "geopandas", "rasterio", "shapely", "tzdata"]
animation = ["pillow", "imageio", "imageio-ffmpeg"]
all = ["sun_graph[graph,map,animation]"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/mcampilho/sun_graph"

# The three scripts live in src/sun_graph/. They can be run directly
# (python src/sun_graph/solar_graph.py ...) or, after `pip install .`,
# with the commands below.
[project.scripts]
solar_graph = "sun_graph.solar_graph:main"
solar_time_map = "sun_graph.solar_time_map:main"
earth_moon_sun = "sun_graph.earth_moon_sun:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/sun_graph"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E702", "E731", "B905"]
